name: CPI Multi Package Compare PDF Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *" # Daily 10 PM IST

permissions:
  contents: write

jobs:
  compare-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          pip install reportlab

      - name: Install SAP Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Prepare Folders
        run: |
          mkdir -p cpi-artifacts latest-download temp-compare reports

      - name: Download and Compare All iFlows
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
        run: |
          MANIFEST_FILE="cpi-artifacts/iflows.txt"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "$MANIFEST_FILE not found"
            exit 1
          fi

          cat > compare_all.py << 'PY'
          import os, zipfile, csv, shutil
          from datetime import datetime

          rows = []
          summary = {
              "total": 0,
              "first_time": 0,
              "changed": 0,
              "no_change": 0,
              "failed": 0,
              "added_files": 0,
              "modified_files": 0,
              "deleted_files": 0,
          }

          def list_files(base):
              result = {}
              for root, dirs, files in os.walk(base):
                  for f in files:
                      path = os.path.join(root, f)
                      rel = os.path.relpath(path, base)
                      result[rel] = path
              return result

          def unzip_file(src, dest):
              with zipfile.ZipFile(src, "r") as z:
                  z.extractall(dest)

          def compare_zip(package, iflow, old_zip, new_zip):
              summary["total"] += 1

              safe_name = f"{package}_{iflow}".replace("/", "_").replace(" ", "_")
              old_dir = f"temp-compare/{safe_name}/old"
              new_dir = f"temp-compare/{safe_name}/new"

              os.makedirs(old_dir, exist_ok=True)
              os.makedirs(new_dir, exist_ok=True)

              if not os.path.exists(new_zip):
                  summary["failed"] += 1
                  rows.append([package, iflow, "FAILED", "Latest artifact not downloaded", 0, 0, 0])
                  return

              first_time = not os.path.exists(old_zip)

              try:
                  if not first_time:
                      unzip_file(old_zip, old_dir)

                  unzip_file(new_zip, new_dir)

                  old_files = list_files(old_dir) if not first_time else {}
                  new_files = list_files(new_dir)

                  added = sorted(set(new_files) - set(old_files))
                  deleted = sorted(set(old_files) - set(new_files))
                  common = sorted(set(old_files) & set(new_files))

                  modified = []
                  for rel in common:
                      try:
                          with open(old_files[rel], "rb") as f:
                              old_content = f.read()
                          with open(new_files[rel], "rb") as f:
                              new_content = f.read()
                          if old_content != new_content:
                              modified.append(rel)
                      except Exception:
                          pass

                  if first_time:
                      status = "FIRST TIME BACKUP"
                      summary["first_time"] += 1
                  elif added or modified or deleted:
                      status = "CHANGED"
                      summary["changed"] += 1
                  else:
                      status = "NO CHANGE"
                      summary["no_change"] += 1

                  summary["added_files"] += len(added)
                  summary["modified_files"] += len(modified)
                  summary["deleted_files"] += len(deleted)

                  rows.append([
                      package,
                      iflow,
                      status,
                      f"{package}_{iflow}.zip",
                      len(added),
                      len(modified),
                      len(deleted)
                  ])

              except Exception as e:
                  summary["failed"] += 1
                  rows.append([package, iflow, "FAILED", str(e), 0, 0, 0])

          with open("download-list.csv", newline="", encoding="utf-8") as f:
              reader = csv.reader(f)
              for package, iflow in reader:
                  package = package.strip()
                  iflow = iflow.strip()
                  old_zip = f"cpi-artifacts/{package}/{package}_{iflow}.zip"
                  new_zip = f"latest-download/{package}/{iflow}.zip"
                  compare_zip(package, iflow, old_zip, new_zip)

          os.makedirs("reports", exist_ok=True)

          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib import colors

          report_pdf = "reports/cpi-package-comparison-summary.pdf"

          doc = SimpleDocTemplate(report_pdf, pagesize=landscape(A4))
          styles = getSampleStyleSheet()
          story = []

          story.append(Paragraph("SAP BTP Integration Suite - CPI Package Comparison Report", styles["Title"]))
          story.append(Spacer(1, 12))
          story.append(Paragraph(f"Generated On: {datetime.utcnow()} UTC", styles["Normal"]))
          story.append(Spacer(1, 18))

          summary_table = [
              ["Metric", "Count"],
              ["Total iFlows Scanned", str(summary["total"])],
              ["First-time Backups", str(summary["first_time"])],
              ["Changed iFlows", str(summary["changed"])],
              ["No Change iFlows", str(summary["no_change"])],
              ["Failed iFlows", str(summary["failed"])],
              ["Total Added Files", str(summary["added_files"])],
              ["Total Modified Files", str(summary["modified_files"])],
              ["Total Deleted Files", str(summary["deleted_files"])],
          ]

          t1 = Table(summary_table, colWidths=[220, 120])
          t1.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
              ("GRID", (0,0), (-1,-1), 0.5, colors.grey),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
              ("ALIGN", (1,1), (-1,-1), "CENTER"),
          ]))
          story.append(Paragraph("Overall Summary", styles["Heading2"]))
          story.append(t1)
          story.append(Spacer(1, 24))

          detail_table = [["Package", "iFlow", "Status", "Artifact", "Added", "Modified", "Deleted"]] + rows

          t2 = Table(detail_table, colWidths=[90, 150, 120, 220, 60, 70, 60], repeatRows=1)
          t2.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
              ("GRID", (0,0), (-1,-1), 0.4, colors.grey),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
              ("FONTSIZE", (0,0), (-1,-1), 8),
              ("VALIGN", (0,0), (-1,-1), "TOP"),
              ("ALIGN", (4,1), (-1,-1), "CENTER"),
          ]))
          story.append(Paragraph("Package / iFlow Comparison Details", styles["Heading2"]))
          story.append(t2)

          doc.build(story)
          PY

          > download-list.csv

          while IFS= read -r LINE || [ -n "$LINE" ]
          do
            LINE=$(echo "$LINE" | xargs)

            if [ -z "$LINE" ]; then
              continue
            fi

            if [[ "$LINE" == \#* ]]; then
              continue
            fi

            PACKAGE_NAME=$(echo "$LINE" | cut -d'|' -f1 | xargs)
            FLOW_ID=$(echo "$LINE" | cut -d'|' -f2- | xargs)

            if [ -z "$PACKAGE_NAME" ] || [ -z "$FLOW_ID" ]; then
              echo "Invalid line: $LINE"
              echo "Expected format: packageName|iFlowId"
              exit 1
            fi

            echo "Processing package=$PACKAGE_NAME iFlow=$FLOW_ID"

            mkdir -p "latest-download/${PACKAGE_NAME}"
            mkdir -p "cpi-artifacts/${PACKAGE_NAME}"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./latest-download/${PACKAGE_NAME}"

            echo "${PACKAGE_NAME},${FLOW_ID}" >> download-list.csv

          done < "$MANIFEST_FILE"

          python compare_all.py

          while IFS=, read -r PACKAGE_NAME FLOW_ID
          do
            SRC="latest-download/${PACKAGE_NAME}/${FLOW_ID}.zip"
            DEST="cpi-artifacts/${PACKAGE_NAME}/${PACKAGE_NAME}_${FLOW_ID}.zip"

            if [ -f "$SRC" ]; then
              cp "$SRC" "$DEST"
            fi
          done < download-list.csv

      - name: Commit Artifact and Single PDF Report
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper compare_all.py download-list.csv
          rm -rf latest-download temp-compare

          git add cpi-artifacts/ reports/cpi-package-comparison-summary.pdf

          git commit -m "Compare and backup all CPI package iFlows" || echo "No changes"
          git push
