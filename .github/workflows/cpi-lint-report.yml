name: CPI Lint PDF Report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pull All CPI Packages and iFlows"]
    types:
      - completed

permissions:
  contents: write

jobs:
  cpi-lint:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          pip install pandas matplotlib reportlab

      - name: Run CPI Lint and Generate PDF Report
        run: |
          cat > cpi_lint_pdf.py << 'PY'
          import os, re, zipfile
          from datetime import datetime
          import pandas as pd
          import matplotlib.pyplot as plt
          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, Image, PageBreak
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib import colors

          os.makedirs("reports", exist_ok=True)
          os.makedirs("reports/charts", exist_ok=True)
          os.makedirs("lint-unzip", exist_ok=True)

          results = []

          def add(package, iflow, check, severity, status, observation, recommendation):
              results.append({
                  "Package": package,
                  "iFlow": iflow,
                  "Check": check,
                  "Severity": severity,
                  "Status": status,
                  "Observation": observation,
                  "Recommendation": recommendation
              })

          def read_text(path):
              try:
                  return open(path, "r", encoding="utf-8", errors="ignore").read()
              except:
                  return ""

          def scan_files(path):
              out = []
              for root, dirs, files in os.walk(path):
                  for f in files:
                      out.append(os.path.join(root, f))
              return out

          zip_files = []
          for root, dirs, files in os.walk("cpi-artifacts"):
              for f in files:
                  if f.endswith(".zip"):
                      zip_files.append(os.path.join(root, f))

          if not zip_files:
              add("-", "-", "Artifact Availability", "HIGH", "FAIL", "No CPI ZIP artifacts found", "Run pull workflow first")

          for zip_path in zip_files:
              package = os.path.basename(os.path.dirname(zip_path))
              zip_name = os.path.basename(zip_path).replace(".zip", "")
              iflow = zip_name.replace(f"{package}_", "", 1)

              unzip_path = f"lint-unzip/{package}/{iflow}"
              os.makedirs(unzip_path, exist_ok=True)

              try:
                  with zipfile.ZipFile(zip_path, "r") as z:
                      z.extractall(unzip_path)
              except Exception as e:
                  add(package, iflow, "ZIP Validation", "HIGH", "FAIL", "ZIP extraction failed", str(e))
                  continue

              all_files = scan_files(unzip_path)
              iflw_files = [x for x in all_files if x.endswith(".iflw")]
              groovy_files = [x for x in all_files if x.endswith(".groovy")]

              add(package, iflow, "iFlow XML Exists", "HIGH",
                  "PASS" if iflw_files else "FAIL",
                  "iFlow XML found" if iflw_files else "iFlow XML missing",
                  "No action required" if iflw_files else "Check artifact export")

              valid_name = re.match(r"^[A-Za-z0-9_\-]+$", iflow) is not None
              add(package, iflow, "Naming Convention", "MEDIUM",
                  "PASS" if valid_name else "WARN",
                  "Technical ID is valid" if valid_name else "Technical ID has spaces/special characters",
                  "Use letters, numbers, underscore, or hyphen")

              secret_patterns = ["password", "clientsecret", "apikey", "api_key", "Bearer ", "Basic "]
              secret_found = False

              for file in all_files:
                  content = read_text(file)
                  for pattern in secret_patterns:
                      if pattern.lower() in content.lower():
                          secret_found = True
                          add(package, iflow, "Hardcoded Secret Scan", "CRITICAL", "FAIL",
                              f"Possible secret found: {pattern}",
                              "Move secrets to CPI Security Material")

              if not secret_found:
                  add(package, iflow, "Hardcoded Secret Scan", "CRITICAL", "PASS",
                      "No hardcoded secret found", "No action required")

              if groovy_files:
                  for gf in groovy_files:
                      content = read_text(gf)
                      has_try_catch = "try" in content and "catch" in content

                      add(package, iflow, "Groovy Exception Handling", "MEDIUM",
                          "PASS" if has_try_catch else "WARN",
                          "try/catch found" if has_try_catch else "try/catch missing",
                          "Add exception handling if required")
              else:
                  add(package, iflow, "Groovy Script Check", "LOW", "PASS",
                      "No Groovy script found", "No action required")

              default_names = ["Content Modifier 1", "Content Modifier 2", "Request Reply 1", "Router 1", "Groovy Script 1"]
              default_found = False

              for file in iflw_files:
                  content = read_text(file)
                  for name in default_names:
                      if name in content:
                          default_found = True
                          add(package, iflow, "Default Step Naming", "MEDIUM", "WARN",
                              f"Default step name found: {name}",
                              "Rename step with meaningful business name")

              if not default_found:
                  add(package, iflow, "Default Step Naming", "MEDIUM", "PASS",
                      "No default step names found", "No action required")

              exception_found = False
              for file in iflw_files:
                  content = read_text(file)
                  if "Exception Subprocess" in content or "subProcess" in content:
                      exception_found = True

              add(package, iflow, "Exception Handling Design", "MEDIUM",
                  "PASS" if exception_found else "WARN",
                  "Exception subprocess found" if exception_found else "No exception subprocess detected",
                  "Add exception subprocess if project standard requires it")

          df = pd.DataFrame(results)

          def make_chart(series, title, filename, chart_type="bar"):
              plt.figure(figsize=(7, 4))
              if chart_type == "pie":
                  plt.pie(series.values, labels=series.index.astype(str), autopct="%1.0f%%")
              else:
                  plt.bar(series.index.astype(str), series.values)
                  plt.xticks(rotation=20, ha="right")
              plt.title(title)
              plt.tight_layout()
              path = f"reports/charts/{filename}"
              plt.savefig(path, dpi=150)
              plt.close()
              return path

          status_chart = make_chart(df.groupby("Status").size(), "Pass / Fail / Warning Summary", "status.png", "pie")
          severity_chart = make_chart(df.groupby("Severity").size(), "Severity Summary", "severity.png")
          package_chart = make_chart(df[df["Status"].isin(["FAIL", "WARN"])].groupby("Package").size(), "Package-wise Issues", "package.png")
          iflow_chart = make_chart(df[df["Status"].isin(["FAIL", "WARN"])].groupby("iFlow").size(), "iFlow-wise Issues", "iflow.png")

          critical_high = df[(df["Status"] == "FAIL") & (df["Severity"].isin(["CRITICAL", "HIGH"]))]
          decision = "READY FOR DEPLOYMENT" if critical_high.empty else "DEPLOYMENT BLOCKED"

          package_summary = df.groupby("Package").agg(
              Total_Checks=("Check", "count"),
              Passed=("Status", lambda x: (x == "PASS").sum()),
              Failed=("Status", lambda x: (x == "FAIL").sum()),
              Warnings=("Status", lambda x: (x == "WARN").sum())
          ).reset_index()

          iflow_summary = df.groupby(["Package", "iFlow"]).agg(
              Total_Checks=("Check", "count"),
              Passed=("Status", lambda x: (x == "PASS").sum()),
              Failed=("Status", lambda x: (x == "FAIL").sum()),
              Warnings=("Status", lambda x: (x == "WARN").sum())
          ).reset_index()

          doc = SimpleDocTemplate("reports/cpi-lint-report.pdf", pagesize=landscape(A4))
          styles = getSampleStyleSheet()
          story = []

          story.append(Paragraph("SAP BTP Integration Suite - CPI Lint Validation Report", styles["Title"]))
          story.append(Spacer(1, 12))
          story.append(Paragraph(f"Generated On: {datetime.utcnow()} UTC", styles["Normal"]))
          story.append(Paragraph(f"Final Decision: {decision}", styles["Heading2"]))
          story.append(Spacer(1, 12))

          summary = [
              ["Metric", "Count"],
              ["Total Packages", df["Package"].nunique()],
              ["Total iFlows", df["iFlow"].nunique()],
              ["Total Checks", len(df)],
              ["Passed", len(df[df["Status"] == "PASS"])],
              ["Failed", len(df[df["Status"] == "FAIL"])],
              ["Warnings", len(df[df["Status"] == "WARN"])]
          ]

          table = Table(summary)
          table.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
              ("GRID", (0,0), (-1,-1), 0.5, colors.grey),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold")
          ]))
          story.append(table)
          story.append(PageBreak())

          story.append(Paragraph("Graphical Analysis", styles["Heading2"]))
          story.append(Table([
              [Image(status_chart, width=350, height=200), Image(severity_chart, width=350, height=200)],
              [Image(package_chart, width=350, height=200), Image(iflow_chart, width=350, height=200)]
          ]))
          story.append(PageBreak())

          def add_df(title, dataframe):
              story.append(Paragraph(title, styles["Heading2"]))
              data = [list(dataframe.columns)] + dataframe.astype(str).values.tolist()
              t = Table(data, repeatRows=1)
              t.setStyle(TableStyle([
                  ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
                  ("GRID", (0,0), (-1,-1), 0.4, colors.grey),
                  ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
                  ("FONTSIZE", (0,0), (-1,-1), 7),
                  ("VALIGN", (0,0), (-1,-1), "TOP")
              ]))
              story.append(t)
              story.append(PageBreak())

          add_df("Package Summary", package_summary)
          add_df("iFlow Summary", iflow_summary)
          add_df("Detailed Validation Results", df[["Package", "iFlow", "Check", "Severity", "Status", "Observation", "Recommendation"]])

          doc.build(story)

          if not critical_high.empty:
              open("lint_failed.flag", "w").write("true")
          PY

          python cpi_lint_pdf.py

      - name: Commit CPI Lint PDF Report
        if: always()
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f cpi_lint_pdf.py
          rm -rf lint-unzip reports/charts

          git add reports/cpi-lint-report.pdf
          git commit -m "Generate CPI lint PDF report" || echo "No report changes"
          git push

      - name: Stop if CPI Lint Failed
        if: always()
        run: |
          if [ -f "lint_failed.flag" ]; then
            echo "CPI lint failed. Please check reports/cpi-lint-report.pdf"
            exit 1
          fi

          echo "CPI lint passed successfully"
