name: CPI Package Download to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"   # Daily 10 PM IST

permissions:
  contents: write

jobs:
  download-package:
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: test
      CPI_API_URL: https://391c9555trial.it-cpitrial05.cfapps.us10-001.hana.ondemand.com
      CPI_TOKEN_URL: https://391c9555trial.authentication.us10.hana.ondemand.com/oauth/token

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Read all iFlows from Package and Download
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
        run: |
          echo "$PIPER_apiServiceKey" > service-key.json

          CLIENT_ID=$(jq -r '.clientid' service-key.json)
          CLIENT_SECRET=$(jq -r '.clientsecret' service-key.json)

          echo "Getting access token..."

          ACCESS_TOKEN=$(curl -s -X POST \
            "$CPI_TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" | jq -r '.access_token')

          echo "Fetching all iFlows from package: $PACKAGE_ID"

          curl -s -f \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "$CPI_API_URL/api/v1/IntegrationPackages('$PACKAGE_ID')/IntegrationDesigntimeArtifacts" \
            -o artifacts.json

          cat artifacts.json

          mkdir -p cpi-artifacts

          ARTIFACT_IDS=$(jq -r '.d.results[].Id' artifacts.json)

          echo "Artifacts found:"
          echo "$ARTIFACT_IDS"

          for FLOW_ID in $ARTIFACT_IDS
          do
            echo "Downloading iFlow: $FLOW_ID"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./cpi-artifacts"
          done

      - name: Commit and Push to Repo
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper service-key.json artifacts.json

          git add cpi-artifacts/
          git commit -m "Backup all iFlows from package: test" || echo "No changes"
          git push
