name: CPI Package Download to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"   # Daily 10 PM IST

permissions:
  contents: write

jobs:
  download-package:
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Read all iFlows from Package
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
        run: |
          echo "$PIPER_apiServiceKey" > service-key.json

          TOKEN_URL=$(jq -r '.tokenurl // .uaa.url // .oauth.url' service-key.json)
          CLIENT_ID=$(jq -r '.clientid // .uaa.clientid // .oauth.clientid' service-key.json)
          CLIENT_SECRET=$(jq -r '.clientsecret // .uaa.clientsecret // .oauth.clientsecret' service-key.json)
          CPI_URL=$(jq -r '.url // .uri // .endpoints.integration' service-key.json)

          echo "TOKEN_URL found: $TOKEN_URL"
          echo "CPI_URL found: $CPI_URL"

          ACCESS_TOKEN=$(curl -s -X POST \
            "$TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET" | jq -r '.access_token')

          echo "Fetching artifacts from package: $PACKAGE_ID"

          curl -s -f \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$CPI_URL/api/v1/IntegrationPackages('$PACKAGE_ID')/IntegrationDesigntimeArtifacts" \
            -o artifacts.json

          cat artifacts.json

          mkdir -p cpi-artifacts

          ARTIFACT_IDS=$(jq -r '.d.results[].Id // .value[].Id' artifacts.json)

          echo "Artifacts found:"
          echo "$ARTIFACT_IDS"

          for FLOW_ID in $ARTIFACT_IDS
          do
            echo "Downloading: $FLOW_ID"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./cpi-artifacts"
          done
