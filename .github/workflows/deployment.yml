name: MULTI PACKAGE - CPI Download + PDF Lint Report

on:
  workflow_dispatch:
    inputs:
      jiraKey:
        description: "Jira Ticket Key"
        required: false
        type: string
      packageName:
        description: "Package Name from Jira"
        required: false
        type: string
  schedule:
    - cron: "30 16 * * *" # Daily 10 PM IST

permissions:
  contents: write

jobs:
  download-lint-report:
    runs-on: ubuntu-latest

    steps:
      - name: Print Trigger Info
        run: |
          echo "Triggered by Jira Key: ${{ github.event.inputs.jiraKey }}"
          echo "Package from Jira: ${{ github.event.inputs.packageName }}"

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          pip install pandas matplotlib reportlab

      - name: Install SAP Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Download all iFlows from all packages
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
          JIRA_KEY: ${{ github.event.inputs.jiraKey }}
          JIRA_PACKAGE_NAME: ${{ github.event.inputs.packageName }}
        run: |
          MANIFEST_FILE="cpi-artifacts/iflows.txt"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "$MANIFEST_FILE not found"
            exit 1
          fi

          mkdir -p cpi-artifacts reports
          rm -f downloaded-list.txt

          while IFS= read -r LINE || [ -n "$LINE" ]
          do
            LINE=$(echo "$LINE" | xargs)

            if [ -z "$LINE" ] || [[ "$LINE" == \#* ]]; then
              continue
            fi

            PACKAGE_NAME=$(echo "$LINE" | cut -d'|' -f1 | xargs)
            FLOW_ID=$(echo "$LINE" | cut -d'|' -f2- | xargs)

            if [ -n "$JIRA_PACKAGE_NAME" ] && [ "$PACKAGE_NAME" != "$JIRA_PACKAGE_NAME" ]; then
              echo "Skipping package $PACKAGE_NAME because Jira requested $JIRA_PACKAGE_NAME"
              continue
            fi

            echo "Package: $PACKAGE_NAME"
            echo "Downloading iFlow: $FLOW_ID"

            mkdir -p "cpi-artifacts/${PACKAGE_NAME}"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./cpi-artifacts/${PACKAGE_NAME}"

            ZIP_FILE="./cpi-artifacts/${PACKAGE_NAME}/${FLOW_ID}.zip"
            TARGET_FILE="./cpi-artifacts/${PACKAGE_NAME}/${PACKAGE_NAME}_${FLOW_ID}.zip"

            if [ -f "$ZIP_FILE" ]; then
              mv "$ZIP_FILE" "$TARGET_FILE"
            fi

            echo "${PACKAGE_NAME}|${FLOW_ID}" >> downloaded-list.txt

          done < "$MANIFEST_FILE"

      - name: Run CPI Lint and Generate PDF Report
        env:
          JIRA_KEY: ${{ github.event.inputs.jiraKey }}
        run: |
          cat > cpi_lint_pdf.py << 'PY'
          import os, re, zipfile
          from datetime import datetime
          import pandas as pd
          import matplotlib.pyplot as plt

          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, Image, PageBreak
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib import colors

          os.makedirs("reports", exist_ok=True)
          os.makedirs("lint-unzip", exist_ok=True)
          os.makedirs("reports/charts", exist_ok=True)

          results = []

          def add(package, iflow, check, severity, status, observation, recommendation, file="-"):
              results.append({
                  "Package": package,
                  "iFlow": iflow,
                  "Check": check,
                  "Severity": severity,
                  "Status": status,
                  "Observation": observation,
                  "Recommendation": recommendation,
                  "File": file
              })

          def unzip_file(src, dest):
              with zipfile.ZipFile(src, "r") as z:
                  z.extractall(dest)

          def scan_files(path):
              output = []
              for root, dirs, files in os.walk(path):
                  for file in files:
                      output.append(os.path.join(root, file))
              return output

          def read_text(file):
              try:
                  return open(file, "r", encoding="utf-8", errors="ignore").read()
              except Exception:
                  return ""

          secret_patterns = [
              (r"password\s*=", "Possible hardcoded password found", "Move password to CPI Security Material or externalized parameter"),
              (r"clientsecret", "Possible client secret found", "Move client secret to secure credential store"),
              (r"apikey", "Possible API key found", "Move API key to secure parameter/security material"),
              (r"api_key", "Possible API key found", "Move API key to secure parameter/security material"),
              (r"token\s*=", "Possible token found", "Move token to secure credential store"),
              (r"Bearer\s+[A-Za-z0-9_\-\.]+", "Bearer token pattern found", "Do not hardcode bearer token"),
              (r"Basic\s+[A-Za-z0-9_\-\.=]+", "Basic authorization pattern found", "Do not hardcode authorization value")
          ]

          if not os.path.exists("downloaded-list.txt"):
              add("-", "-", "Download Validation", "HIGH", "FAIL", "No CPI artifact was downloaded", "Check manifest file and SAP service key")
          else:
              with open("downloaded-list.txt", "r", encoding="utf-8") as f:
                  lines = [x.strip() for x in f.readlines() if x.strip()]

              for line in lines:
                  package, iflow = line.split("|", 1)
                  zip_path = f"cpi-artifacts/{package}/{package}_{iflow}.zip"
                  unzip_path = f"lint-unzip/{package}/{iflow}"

                  if not os.path.exists(zip_path):
                      add(package, iflow, "Artifact ZIP Validation", "HIGH", "FAIL", "Artifact ZIP not found", "Verify iFlow technical ID in cpi-artifacts/iflows.txt", zip_path)
                      continue

                  os.makedirs(unzip_path, exist_ok=True)
                  unzip_file(zip_path, unzip_path)

                  all_files = scan_files(unzip_path)
                  iflw_files = [x for x in all_files if x.endswith(".iflw")]
                  groovy_files = [x for x in all_files if x.endswith(".groovy")]

                  add(package, iflow, "iFlow XML Exists", "HIGH",
                      "PASS" if iflw_files else "FAIL",
                      "iFlow XML found" if iflw_files else "iFlow XML missing",
                      "No action required" if iflw_files else "Re-export artifact or check artifact structure")

                  valid_name = re.match(r"^[A-Za-z0-9_\-]+$", iflow) is not None
                  add(package, iflow, "Naming Convention", "MEDIUM",
                      "PASS" if valid_name else "FAIL",
                      "Valid technical ID" if valid_name else "Technical ID contains spaces/special characters",
                      "No action required" if valid_name else "Use only letters, numbers, underscore, or hyphen")

                  secret_found = False
                  for file in all_files:
                      content = read_text(file)
                      for pattern, observation, recommendation in secret_patterns:
                          if re.search(pattern, content, re.IGNORECASE):
                              secret_found = True
                              add(package, iflow, "Hardcoded Secret Scan", "CRITICAL", "FAIL", observation, recommendation, file)

                  if not secret_found:
                      add(package, iflow, "Hardcoded Secret Scan", "CRITICAL", "PASS", "No hardcoded secret pattern found", "No action required")

                  if groovy_files:
                      for gf in groovy_files:
                          content = read_text(gf)
                          has_try_catch = "try" in content and "catch" in content

                          add(package, iflow, "Groovy Exception Handling", "MEDIUM",
                              "PASS" if has_try_catch else "WARN",
                              "try/catch block found" if has_try_catch else "try/catch block not detected",
                              "No action required" if has_try_catch else "Add exception handling in Groovy script",
                              gf)

                          add(package, iflow, "Groovy Logging Standard", "LOW",
                              "WARN" if "println" in content else "PASS",
                              "println statement found" if "println" in content else "No println statement found",
                              "Use proper logging/message log instead of println" if "println" in content else "No action required",
                              gf)
                  else:
                      add(package, iflow, "Groovy Script Check", "LOW", "PASS", "No Groovy script found", "No action required")

                  default_found = False
                  bad_names = [
                      "Content Modifier 1",
                      "Content Modifier 2",
                      "Content Modifier 3",
                      "Request Reply 1",
                      "Request Reply 2",
                      "Router 1",
                      "Router 2",
                      "Groovy Script 1",
                      "Groovy Script 2",
                      "Message Mapping 1"
                  ]

                  for file in iflw_files:
                      content = read_text(file)
                      for name in bad_names:
                          if name in content:
                              default_found = True
                              add(package, iflow, "Default Step Naming", "MEDIUM", "FAIL",
                                  f"Default generated step name found: {name}",
                                  "Rename step with meaningful business/technical name",
                                  file)

                  if not default_found:
                      add(package, iflow, "Default Step Naming", "MEDIUM", "PASS", "No default generated step names found", "No action required")

                  exception_found = False
                  for file in iflw_files:
                      content = read_text(file)
                      if "Exception Subprocess" in content or "subProcess" in content:
                          exception_found = True

                  add(package, iflow, "Exception Handling Design", "MEDIUM",
                      "PASS" if exception_found else "WARN",
                      "Exception subprocess found" if exception_found else "No exception subprocess detected",
                      "No action required" if exception_found else "Add exception subprocess if required by project standard")

                  content_modifier_count = 0
                  for file in iflw_files:
                      content = read_text(file)
                      content_modifier_count += content.count("Content Modifier")

                  add(package, iflow, "Content Modifier Count", "LOW",
                      "WARN" if content_modifier_count > 5 else "PASS",
                      f"{content_modifier_count} content modifiers found",
                      "Review if some content modifiers can be simplified or combined" if content_modifier_count > 5 else "No action required")

          df = pd.DataFrame(results)

          if df.empty:
              df = pd.DataFrame([{
                  "Package": "-",
                  "iFlow": "-",
                  "Check": "No Data",
                  "Severity": "HIGH",
                  "Status": "FAIL",
                  "Observation": "No lint result generated",
                  "Recommendation": "Check workflow logs",
                  "File": "-"
              }])

          def make_chart(series, title, filename, chart_type="bar"):
              plt.figure(figsize=(7, 4))
              if chart_type == "pie":
                  plt.pie(series.values, labels=series.index.astype(str), autopct="%1.0f%%")
              else:
                  plt.bar(series.index.astype(str), series.values)
                  plt.xticks(rotation=20, ha="right")
              plt.title(title)
              plt.tight_layout()
              path = f"reports/charts/{filename}"
              plt.savefig(path, dpi=150)
              plt.close()
              return path

          status_counts = df.groupby("Status").size()
          severity_counts = df.groupby("Severity").size()
          package_issues = df[df["Status"].isin(["FAIL", "WARN"])].groupby("Package").size()
          iflow_issues = df[df["Status"].isin(["FAIL", "WARN"])].groupby("iFlow").size()

          if package_issues.empty:
              package_issues = pd.Series({"No Issues": 0})
          if iflow_issues.empty:
              iflow_issues = pd.Series({"No Issues": 0})

          status_chart = make_chart(status_counts, "Pass / Fail / Warning Summary", "status.png", "pie")
          severity_chart = make_chart(severity_counts, "Severity-wise Validation Summary", "severity.png", "bar")
          package_chart = make_chart(package_issues, "Package-wise Issues", "package.png", "bar")
          iflow_chart = make_chart(iflow_issues, "iFlow-wise Issues", "iflow.png", "bar")

          total_packages = df["Package"].nunique()
          total_iflows = df["iFlow"].nunique()
          total = len(df)
          passed = len(df[df["Status"] == "PASS"])
          failed = len(df[df["Status"] == "FAIL"])
          warnings = len(df[df["Status"] == "WARN"])

          critical_high_failures = df[(df["Status"] == "FAIL") & (df["Severity"].isin(["CRITICAL", "HIGH"]))]
          deployment_status = "READY FOR DEPLOYMENT" if critical_high_failures.empty else "DEPLOYMENT BLOCKED"

          package_summary = df.groupby("Package").agg(
              Total_Checks=("Check", "count"),
              Passed=("Status", lambda x: (x == "PASS").sum()),
              Failed=("Status", lambda x: (x == "FAIL").sum()),
              Warnings=("Status", lambda x: (x == "WARN").sum())
          ).reset_index()
          package_summary["Status"] = package_summary.apply(lambda r: "BLOCKED" if r["Failed"] > 0 else ("WARNING" if r["Warnings"] > 0 else "PASS"), axis=1)

          iflow_summary = df.groupby(["Package", "iFlow"]).agg(
              Total_Checks=("Check", "count"),
              Passed=("Status", lambda x: (x == "PASS").sum()),
              Failed=("Status", lambda x: (x == "FAIL").sum()),
              Warnings=("Status", lambda x: (x == "WARN").sum())
          ).reset_index()
          iflow_summary["Status"] = iflow_summary.apply(lambda r: "BLOCKED" if r["Failed"] > 0 else ("WARNING" if r["Warnings"] > 0 else "PASS"), axis=1)

          report_pdf = "reports/cpi-lint-report.pdf"

          doc = SimpleDocTemplate(report_pdf, pagesize=landscape(A4), rightMargin=20, leftMargin=20, topMargin=20, bottomMargin=20)
          styles = getSampleStyleSheet()
          story = []

          story.append(Paragraph("SAP BTP Integration Suite - CPI Lint Validation Report", styles["Title"]))
          story.append(Spacer(1, 12))
          story.append(Paragraph(f"Generated On: {datetime.utcnow()} UTC", styles["Normal"]))
          story.append(Paragraph(f"Jira Key: {os.environ.get('JIRA_KEY', '-')}", styles["Normal"]))
          story.append(Spacer(1, 12))
          story.append(Paragraph(f"Final Deployment Decision: {deployment_status}", styles["Heading2"]))
          story.append(Spacer(1, 16))

          exec_table = [
              ["Metric", "Count"],
              ["Total Packages", total_packages],
              ["Total iFlows", total_iflows],
              ["Total Checks", total],
              ["Passed", passed],
              ["Failed", failed],
              ["Warnings", warnings],
          ]

          t = Table(exec_table, colWidths=[220, 100])
          t.setStyle(TableStyle([
              ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
              ("GRID", (0,0), (-1,-1), 0.5, colors.grey),
              ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
              ("ALIGN", (1,1), (-1,-1), "CENTER"),
          ]))
          story.append(Paragraph("Executive Summary", styles["Heading2"]))
          story.append(t)
          story.append(PageBreak())

          story.append(Paragraph("Graphical Analysis", styles["Heading2"]))
          chart_table = Table([
              [Image(status_chart, width=350, height=200), Image(severity_chart, width=350, height=200)],
              [Image(package_chart, width=350, height=200), Image(iflow_chart, width=350, height=200)],
          ])
          story.append(chart_table)
          story.append(PageBreak())

          def table_from_df(title, dataframe, max_rows=None):
              story.append(Paragraph(title, styles["Heading2"]))
              data = [list(dataframe.columns)] + dataframe.astype(str).values.tolist()
              if max_rows:
                  data = data[:max_rows + 1]
              table = Table(data, repeatRows=1)
              table.setStyle(TableStyle([
                  ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
                  ("GRID", (0,0), (-1,-1), 0.4, colors.grey),
                  ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
                  ("FONTSIZE", (0,0), (-1,-1), 7),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
              ]))
              story.append(table)
              story.append(PageBreak())

          table_from_df("Package Summary", package_summary)
          table_from_df("iFlow Summary", iflow_summary)

          detailed_cols = ["Package", "iFlow", "Check", "Severity", "Status", "Observation", "Recommendation"]
          table_from_df("Detailed Validation Results", df[detailed_cols], max_rows=120)

          story.append(Paragraph("Final Deployment Decision", styles["Heading2"]))
          if critical_high_failures.empty:
              story.append(Paragraph("READY FOR DEPLOYMENT - No critical or high severity failures found.", styles["Normal"]))
          else:
              story.append(Paragraph("DEPLOYMENT BLOCKED - Critical or high severity failures found.", styles["Normal"]))
              story.append(Spacer(1, 12))
              blocked_cols = ["Package", "iFlow", "Check", "Severity", "Status", "Observation", "Recommendation"]
              data = [blocked_cols] + critical_high_failures[blocked_cols].astype(str).values.tolist()
              block_table = Table(data, repeatRows=1)
              block_table.setStyle(TableStyle([
                  ("BACKGROUND", (0,0), (-1,0), colors.lightgrey),
                  ("GRID", (0,0), (-1,-1), 0.4, colors.grey),
                  ("FONTNAME", (0,0), (-1,0), "Helvetica-Bold"),
                  ("FONTSIZE", (0,0), (-1,-1), 7),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
              ]))
              story.append(block_table)

          doc.build(story)

          if not critical_high_failures.empty:
              with open("lint_failed.flag", "w") as f:
                  f.write("true")
          PY

          JIRA_KEY="${{ github.event.inputs.jiraKey }}" python cpi_lint_pdf.py

      - name: Commit and Push Artifacts and PDF Lint Report
        if: always()
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper cpi_lint_pdf.py downloaded-list.txt
          rm -rf lint-unzip reports/charts

          git add cpi-artifacts/ reports/cpi-lint-report.pdf

          git commit -m "Backup CPI iFlows and generate PDF lint report for Jira ${{ github.event.inputs.jiraKey }}" || echo "No changes"

          git push

      - name: Stop if CPI Lint Failed
        if: always()
        run: |
          if [ -f "lint_failed.flag" ]; then
            echo "CPI lint failed. Please check reports/cpi-lint-report.pdf"
            exit 1
          fi

          echo "CPI lint passed successfully"
