name: TEST - CPI Package Download to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: write

env:
  PACKAGE_NAME: test

jobs:
  download-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install SAP Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Download all iFlows
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
        run: |
          mkdir -p cpi-artifacts/${PACKAGE_NAME}

          if [ ! -f "cpi-artifacts/iflows.txt" ]; then
            echo "cpi-artifacts/iflows.txt not found"
            exit 1
          fi

          echo "Reading iFlows..."

          while IFS= read -r FLOW_ID || [ -n "$FLOW_ID" ]
          do
            FLOW_ID=$(echo "$FLOW_ID" | xargs)

            if [ -z "$FLOW_ID" ]; then
              continue
            fi

            if [[ "$FLOW_ID" == \#* ]]; then
              continue
            fi

            echo "Downloading iFlow: $FLOW_ID"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./cpi-artifacts/${PACKAGE_NAME}"

            ZIP_FILE="./cpi-artifacts/${PACKAGE_NAME}/${FLOW_ID}.zip"

            if [ -f "$ZIP_FILE" ]; then
              mv "$ZIP_FILE" "./cpi-artifacts/${PACKAGE_NAME}/${PACKAGE_NAME}_${FLOW_ID}.zip"
            fi

          done < cpi-artifacts/iflows.txt

      - name: Commit and Push to Repo
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper

          git add cpi-artifacts/

          git commit -m "Backup all CPI iFlows from package ${PACKAGE_NAME}" || echo "No changes"

          git push
