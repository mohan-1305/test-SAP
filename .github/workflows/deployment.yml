name: CPI Package Download to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"   # Daily 10 PM IST

permissions:
  contents: write

jobs:
  download-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Piper
        run: |
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper

      - name: Download all iFlows listed in iflows.txt
        env:
          PIPER_apiServiceKey: ${{ secrets.PIPER_apiServiceKey }}
        run: |
          mkdir -p cpi-artifacts

          if [ ! -f "iflows.txt" ]; then
            echo "iflows.txt not found"
            exit 1
          fi

          while IFS= read -r FLOW_ID || [ -n "$FLOW_ID" ]
          do
            FLOW_ID=$(echo "$FLOW_ID" | xargs)

            if [ -z "$FLOW_ID" ]; then
              continue
            fi

            if [[ "$FLOW_ID" == \#* ]]; then
              continue
            fi

            echo "Downloading iFlow: $FLOW_ID"

            ./piper integrationArtifactDownload \
              --integrationFlowId "$FLOW_ID" \
              --integrationFlowVersion "active" \
              --downloadPath "./cpi-artifacts"

          done < iflows.txt

      - name: Commit and Push to Repo
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper

          git add cpi-artifacts/
          git commit -m "Backup all configured CPI iFlows" || echo "No changes"
          git push
