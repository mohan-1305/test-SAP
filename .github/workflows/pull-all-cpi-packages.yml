name: Pull All CPI Packages and iFlows

on:
  workflow_dispatch:
    inputs:
      jiraKey:
        description: "Jira Ticket Key"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  pull-all-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl gh
          curl -L https://github.com/SAP/jenkins-library/releases/latest/download/piper -o piper
          chmod +x piper
          ./piper version

      - name: Discover Packages and Download All iFlows
        env:
          PIPER_APISERVICEKEY: ${{ secrets.PIPER_APISERVICEKEY }}
        run: |
          set -e

          echo "$PIPER_APISERVICEKEY" > service-key.json

          CLIENT_ID=$(jq -r '.clientid // .uaa.clientid // .oauth.clientid // .credentials.clientid' service-key.json)
          CLIENT_SECRET=$(jq -r '.clientsecret // .uaa.clientsecret // .oauth.clientsecret // .credentials.clientsecret' service-key.json)
          CPI_API_URL=$(jq -r '.url // .oauth.url // .credentials.url' service-key.json)
          CPI_TOKEN_URL=$(jq -r '.tokenurl // .oauth.tokenurl // .uaa.url // .credentials.tokenurl' service-key.json)

          if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "null" ]; then
            echo "CLIENT_ID not found"
            exit 1
          fi

          if [ -z "$CLIENT_SECRET" ] || [ "$CLIENT_SECRET" = "null" ]; then
            echo "CLIENT_SECRET not found"
            exit 1
          fi

          if [ -z "$CPI_API_URL" ] || [ "$CPI_API_URL" = "null" ]; then
            echo "CPI_API_URL not found"
            exit 1
          fi

          if [ -z "$CPI_TOKEN_URL" ] || [ "$CPI_TOKEN_URL" = "null" ]; then
            echo "CPI_TOKEN_URL not found"
            exit 1
          fi

          CPI_API_URL="${CPI_API_URL%/}"
          CPI_TOKEN_URL="${CPI_TOKEN_URL%/}"

          jq -n \
            --arg clientid "$CLIENT_ID" \
            --arg clientsecret "$CLIENT_SECRET" \
            --arg url "$CPI_API_URL" \
            --arg tokenurl "$CPI_TOKEN_URL" \
            '{
              clientid: $clientid,
              clientsecret: $clientsecret,
              url: $url,
              tokenurl: $tokenurl
            }' > flat-service-key.json

          FLAT_SERVICE_KEY=$(cat flat-service-key.json)

          echo "Service key validated"
          echo "CPI API Host: $(echo "$CPI_API_URL" | sed 's#https://##' | cut -d'/' -f1)"
          echo "Token Host: $(echo "$CPI_TOKEN_URL" | sed 's#https://##' | cut -d'/' -f1)"

          TOKEN_RESPONSE=$(curl -s -L -X POST \
            "$CPI_TOKEN_URL?grant_type=client_credentials" \
            -u "$CLIENT_ID:$CLIENT_SECRET")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Access token failed"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "Access token generated"

          mkdir -p cpi-artifacts
          rm -f downloaded-list.txt packages.json artifacts.json

          echo "Fetching all CPI packages..."

          PACKAGE_HTTP_CODE=$(curl -s -L -w "%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "$CPI_API_URL/api/v1/IntegrationPackages?\$format=json" \
            -o packages.json)

          echo "Package API HTTP Code: $PACKAGE_HTTP_CODE"
          cat packages.json || true

          if [ "$PACKAGE_HTTP_CODE" != "200" ]; then
            echo "Package API failed"
            exit 1
          fi

          PACKAGE_IDS=$(jq -r '.d.results[]?.Id' packages.json)

          if [ -z "$PACKAGE_IDS" ]; then
            echo "No CPI packages found"
            exit 0
          fi

          echo "Packages found:"
          echo "$PACKAGE_IDS"

          for PACKAGE_ID in $PACKAGE_IDS
          do
            echo "----------------------------------------"
            echo "Package: $PACKAGE_ID"

            ARTIFACT_HTTP_CODE=$(curl -s -L -w "%{http_code}" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Accept: application/json" \
              "$CPI_API_URL/api/v1/IntegrationPackages('$PACKAGE_ID')/IntegrationDesigntimeArtifacts?\$format=json" \
              -o artifacts.json)

            echo "Artifact API HTTP Code: $ARTIFACT_HTTP_CODE"

            if [ "$ARTIFACT_HTTP_CODE" != "200" ]; then
              echo "Skipping package: $PACKAGE_ID"
              cat artifacts.json || true
              continue
            fi

            ARTIFACT_IDS=$(jq -r '.d.results[]?.Id' artifacts.json)

            if [ -z "$ARTIFACT_IDS" ]; then
              echo "No iFlows found in package: $PACKAGE_ID"
              continue
            fi

            mkdir -p "cpi-artifacts/${PACKAGE_ID}"

            for FLOW_ID in $ARTIFACT_IDS
            do
              FLOW_ID=$(echo "$FLOW_ID" | xargs)

              if [ -z "$FLOW_ID" ]; then
                continue
              fi

              echo "Downloading iFlow: $FLOW_ID from package: $PACKAGE_ID"

              ./piper integrationArtifactDownload \
                --apiServiceKey "$FLAT_SERVICE_KEY" \
                --integrationFlowId "$FLOW_ID" \
                --integrationFlowVersion "Active" \
                --downloadPath "./cpi-artifacts/${PACKAGE_ID}"

              ZIP_FILE="./cpi-artifacts/${PACKAGE_ID}/${FLOW_ID}.zip"
              TARGET_FILE="./cpi-artifacts/${PACKAGE_ID}/${PACKAGE_ID}_${FLOW_ID}.zip"

              if [ -f "$ZIP_FILE" ]; then
                mv "$ZIP_FILE" "$TARGET_FILE"
              fi

              echo "${PACKAGE_ID}|${FLOW_ID}" >> downloaded-list.txt
            done
          done

      - name: Commit and Push All CPI Artifacts
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@github.com"

          rm -f piper service-key.json flat-service-key.json packages.json artifacts.json downloaded-list.txt

          git add cpi-artifacts/

          git commit -m "Pull all CPI packages and iFlows from SAP BTP IS" || echo "No changes"
          git push

      - name: Trigger CPI Lint Workflow
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_KEY: ${{ github.event.inputs.jiraKey }}
        run: |
          echo "Triggering CPI Lint Report workflow"

          gh workflow run cpi-lint-report.yml \
            --repo mohan-1305/test-SAP \
            --ref main \
            -f jiraKey="$JIRA_KEY"
